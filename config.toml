# SingMic 配置 —— 改完重启服务才生效(网页上也能直接调,网页调的那个不会存到这儿)。

[audio]
# 耳返输出设备。留空 = 系统默认输出。
# 名字只要「包含」就行,不区分大小写:比如 "Headphones"、"Realtek"、"CABLE"。
# ★ 想让别的软件(OBS / 全民K歌)把这里当成麦克风,就填 "CABLE"(VB-Cable)。
output = ""

[voice]
# 输入增益。1.0 = 不放大。手机麦克风本身够响的话别乱拉。
# ★ 推荐的唱法是嘴离手机 5~10cm,近讲本身就把电平抬了 10dB 左右,
#   再叠很大的增益会直接顶到削波。
gain = 0.9

# 降噪强度 0~1。0 = 关。0.3~0.5 一般最自然;拉满会有「水声」。
# ★ 默认 0:安静环境下底噪很低,不值得用「削掉气声和字尾」去换 ——
#   开着 0.35 时最差 5% 的语音帧会被削 24.8dB,轻音就是在这儿没的。
denoise = 0.2

# 噪声门:不唱的时候把麦克风关掉,免得耳机里全是底噪。
# ★ 默认关:门限 -55dB 会把轻音整段关掉(-50 的轻唱正好压在门限下面)。
gate = false
gate_db = -20

# 三段 EQ,单位 dB,范围 -15 ~ +15。
# ★ 「专业人声」预设,依据是专业混音链的共识:
#   高通之后先做「减法」——低架 -1.5 收掉 250Hz 以下的浑浊(boxiness);
#   再做「加法」——1.5kHz +3 给贴脸的存在感,4kHz 以上 +4 给清晰度和
#   空气感。手机麦克风这一段天然是凹的,这就是它听起来「不像电容麦」的主因。
# ★ 唱男声觉得闷:eq_high +3;觉得薄:eq_low +2。
eq_low = -1.5
eq_mid = 0
eq_high = 2

# 齿音抑制 0~1(网页上那个「齿音」滑杆)。
# ★ 补了高频,s / sh / 齿音一定会跟着亮 —— 这不是补错了,是它们本来就在
#   同一段。专业做法是补完再把那一瞬压回去,而不是不补。这一档只压
#   5.5kHz 以上、只压几十毫秒,中低频一个采样都不碰。
deess = 0

# 压缩:把忽大忽小收一收。唱流行建议开。
# ★ 默认关:先听见「没压缩的声音」。哪天觉得轻的地方听不清,
#   把 comp 打开、ratio 2.5 起步(3:1 是专业常用值)。
comp = false
comp_ratio = 2.5
comp_threshold = -22
makeup = 0

# 混响干湿比 0~1。0.15 是小房间;0.3 已经挺"KTV"了。
# ★ 录音要「专业」就保持 0 —— 混响是混音阶段的事,不该烤进干声里。
reverb = 0

hp_hz = 85
ai = true

[backing]
# ★ 伴奏来源 = 电脑上「正在放声音」的那台设备(环回抓取,原样混入,不加工)。
# 留空 = 不放伴奏。例:"CABLE Input (VB-Audio Virtual Cable)" / "扬声器 (Realtek(R) Audio)"
# ★★ 绝不能和 [audio] output 是同一台设备 —— 会形成回授啸叫,代码会直接拒绝。
source = ""

# music/ 目录里的文件名。留空 = 不放文件伴奏。(界面上已撤,配置文件里仍可用)
file = ""
# 伴奏音量 0~1.5
level = 0.7
# 播完是否循环
loop = false
